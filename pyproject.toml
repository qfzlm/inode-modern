[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inode-modern"
version = "0.2.0b1"
license = "MIT"
license-files = ["LICENSE"]
description = "Native Qt desktop and CLI frontend for the unmodified H3C iNode authentication service"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6,<7", "dbus-python>=1.3"]

[project.scripts]
inode-modern = "inode_modern.cli:main"
inode-modern-gui = "inode_modern.desktop.app:main"

[tool.setuptools.package-data]
"inode_modern.desktop" = ["*.svg"]
"inode_modern" = ["data/*.json"]

[tool.setuptools.packages.find]
include = ["inode_modern*"]
